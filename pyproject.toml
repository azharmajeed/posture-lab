[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posture-lab"
version = "0.1.0"
description = "Webcam posture reminders with interchangeable local and Coral inference"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "opencv-contrib-python>=4.10,<5", "plyer>=2.1,<3"]

[project.optional-dependencies]
local = [
    "mediapipe>=0.10.21,<0.11; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "mediapipe==0.10.21; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "jax==0.4.38; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "jaxlib==0.4.38; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
voice = ["piper-tts>=1.3,<2", "sounddevice>=0.5,<1"]

[project.scripts]
posture-lab = "posture_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
cache-dir = ".uv-cache"
